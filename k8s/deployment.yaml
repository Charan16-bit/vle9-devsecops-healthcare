apiVersion: apps/v1
kind: Deployment
metadata:
  name: vle9-healthcare
  namespace: vle9
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle9-healthcare
  template:
    metadata:
      labels:
        app: vle9-healthcare
    spec:
      containers:
      - name: healthcare-api
        image: vle9-healthcare:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DEMO_API_KEY
          valueFrom:
            secretKeyRef:
              name: vle9-api-secret
              key: api-key
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: vle9-healthcare-service
  namespace: vle9
spec:
  type: NodePort
  selector:
    app: vle9-healthcare
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 30082
